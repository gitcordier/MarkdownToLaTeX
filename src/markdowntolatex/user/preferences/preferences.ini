; =============================================================================================
; LuaLaTeX Master Document Configuration
; Engine: LuaLaTeX
; =============================================================================================
; Conventions
;   - Section names use dot notation for nesting (e.g. [fonts.main]).
;   - List-valued keys are comma-separated.
;   - Empty value (key =) means "load with no options".
;   - Verbatim LaTeX tokens (command, ;1, ...) are preserved as-is.
; =============================================================================================


;------------------------------ DOCUMENT CLASS -----------------------------------------------;
[document]
class            = book
paper            = a4paper
fontsize         = 10pt
options          = a4paper, 10pt, titlepage, openany, leqno


;------------------------------ METADATA -----------------------------------------------------;
[metadata]
title            = Solutions to some exercises from Walter Rudin''s textit{Functional Analysis}
author           = 
email            =
date             = today

;------------------------------ PAGE GEOMETRY ----------------------------------
; usepackage[...]{geometry}
[package:geometry]
left             = 1.9cm
right            = 1.32cm
top              = 1.9cm
bottom           = 3.67cm


;------------------------------ PACKAGES ---------------------------------------
; Packages loaded with no options
[package:plain]
list             = 
;xparse, amsmath, amssymb, physics, amsfonts, mathrsfs, amsthm, mathtools, fouridx, enumitem, diagbox, array, colortbl, fontspec, hyperref, polyglossia

; Packages loaded with options
[package:caption]
labelsep         = period

[package:unicode-math]
math-style       = 
;upright

;------------------------------ HYPERREF SETUP ---------------------------------
; hypersetup{...}
[hypersetup]
pdfborder        = 0 0 0
colorlinks       = true
citecolor        = red
filecolor        = green
linkcolor        = black
urlcolor         = blue


;------------------------------ FONTS ------------------------------------------
; setmainfont
[fonts.main]
font             = NewCM10-Book.otf
italic           = NewCM10-BookItalic.otf
bold             = NewCM10-Bold.otf
bolditalic       = NewCM10-BoldItalic.otf

; setsansfont
[fonts.sans]
font             = NewCMSans10-Book.otf
italic           = NewCMSans10-BookOblique.otf
bold             = NewCMSans10-Bold.otf
bolditalic       = NewCMSans10-BoldOblique.otf

; setmonofont
[fonts.mono]
font             = NewCMMono10-Book.otf
scale            = MatchLowercase
italic           = NewCMMono10-BookItalic.otf
bold             = NewCMMono10-Bold.otf
bolditalic       = NewCMMono10-BoldOblique.otf

; setmathfont
[fonts.math]
font             = NewCMMath-Book.otf


;------------------------------ LANGUAGE ---------------------------------------
; setdefaultlanguage[variant=usmax]{english}
[language]
package          = polyglossia
default          = english
variant          = usmax


;------------------------------ THEOREM STYLE ----------------------------------
; newtheoremstyle{namedlemma}{...}{...}{...}{...}{...}{...}{...}{...}
[theorem.style.namedlemma]
spaceabove       = 3pt
spacebelow       = 20pt
bodyfont         =
indent           =
headfont         = bfseries
headpunct        = .newline
headspace        = newline
headspec         = thmname{$1} thmnumber{$2}thmnote{quad $3}

; theoremstyle{namedlemma}
; newtheorem{lemma}{Lemma}[chapter]
[theorem.lemma]
style            = namedlemma
name             = Lemma
counter_within   = chapter


;------------------------------ PROOF ENVIRONMENT ------------------------------
; renewcommand{proofname}{{rm small PROOF}}
[proof]
proofname        = {rm small PROOF}


;------------------------------ DOCUMENT STRUCTURE -----------------------------
[structure.frontmatter]
enabled          = true
tableofcontents  = true
inputs           = notations.tex
section_numbering    = Roman
subsection_numbering = roman

[structure.mainmatter]
enabled          = true
inputs           = FA_mainmatter.tex
section_numbering    = arabic
subsection_numbering = arabic

[structure.backmatter]
enabled          = true
chapter_title    = Annex
inputs           = annex/annex.tex
chapter_numbering    = Alph
section_numbering    = chapter.arabic
equation_numbering   = chapter.arabic
annex_chapter_start  = 1
annex_section_start  = 1
equation_counter_reset = 0


;------------------------------ BIBLIOGRAPHY -----------------------------------
; bibliographystyle{plain} / bibliography{bibliography}
[bibliography]
style            = plain
file             = bibliography
add_to_toc       = true


; ==============================================================================
; LuaLaTeX Extended Configuration Options
; Supplementary to master.ini
; All keys are commented out (;) — uncomment what you need.
; ==============================================================================


;------------------------------ COMPILER FLAGS ---------------------------------
; Passed to the lualatex binary (latexmk, tectonic, or direct call).
[engine]
; engine             = lualatex
; interaction        = nonstopmode        ; nonstopmode | batchmode | errorstopmode | scrollmode
; synctex            = 1                  ; enable SyncTeX for editor ↔ PDF sync
; shell-escape       = false              ; true required by minted, svg, etc.
; draft              = false              ; disables images, enables overfull boxes
; output-directory   = ./build
; jobname            = FA
; recorder           = true              ; write .fls file (file list, useful for latexmk)
; passes             = 3                 ; number of compile passes (latexmk: $pdf_mode = 4)


;------------------------------ LUATEX SPECIFICS -------------------------------
; Packages and settings that only exist / are best in LuaLaTeX.
[luatex]
; luacode            =                   ; \usepackage{luacode}  — embed Lua in LaTeX
; luatex85           =                   ; \usepackage{luatex85} — compatibility shim
; selnolig           =                   ; \usepackage{selnolig} — suppress wrong ligatures
;                                        ;   e.g. "fi" across morpheme boundaries
; lua-ul             =                   ; \usepackage{lua-ul}   — better underlines in LuaLaTeX


;------------------------------ MICROTYPE --------------------------------------
; LuaLaTeX has the best microtype support of any engine.
; \usepackage[...]{microtype}
[package:microtype]
; name               = microtype
; protrusion         = true              ; hang punctuation into margins
; expansion          = true             ; glyph scaling (hz-program)
; final              = true             ; override \draft
; verbose            = silent
; factor             = 1100             ; expansion factor (default 1000)
; stretch            = 30               ; max stretch (1/1000 em)
; shrink             = 30               ; max shrink
; tracking           = true             ; letter-spacing
; kerning            = true
; spacing            = true             ; inter-word spacing


;------------------------------ FONTSPEC FEATURES ------------------------------
; \defaultfontfeatures and per-family features.
; These go into [fonts.*] as feature keys.
[fonts.features.global]
; Ligatures          = TeX              ; convert -- → en-dash, etc.
; Ligatures          = Common           ; standard ligatures fi fl ff ffi ffl
; Ligatures          = Rare             ; ct, st historical ligatures
; Numbers            = Lining           ; or OldStyle, Proportional, Monospaced
; SmallCapsFeatures  = {Letters=SmallCaps}
; Scale              = MatchLowercase   ; or MatchUppercase, or a decimal (0.95)
; Color              = 222222FF         ; RGBA hex font colour
; WordSpace          = 1.15

[fonts.newfontfamily]
; Define named font families (from your commented-out \newfontfamily lines).
; fw                 = NewCMMono10-Book.otf
; CMUCS              = NewCMMono10-Book.otf


;------------------------------ UNICODE-MATH EXTRA OPTIONS --------------------
; Options for \usepackage[...]{unicode-math}
[package:unicode-math.extra]
; bold-style         = ISO              ; ISO | TeX | upright  (default ISO)
; sans-style         = italic           ; italic | upright
; nabla              = upright          ; upright | italic
; partial            = upright          ; upright | italic
; warnings-off       = {mathtools-colon, mathtools-overbracket}


;------------------------------ EXTENDED HYPERREF ------------------------------
; Additional \hypersetup keys beyond those in master.ini.
[hypersetup.extra]
; pdftitle           = Solutions to some exercises from Rudin's Functional Analysis
; pdfauthor          = gitcordier
; pdfsubject         = Functional Analysis
; pdfkeywords        = Rudin, functional analysis, Banach, Hilbert
; pdflang            = en-US
; bookmarks          = true
; bookmarksnumbered  = true
; bookmarksopen      = true
; bookmarksdepth     = 3
; pdfstartview       = FitH
; pdfdisplaydoctitle = true
; pdfcreator         = LuaLaTeX
; hidelinks          = false            ; hide colored boxes AND colored text
; breaklinks         = true


;------------------------------ COLOR ------------------------------------------
; \usepackage[options]{xcolor}
[package:xcolor]
; name               = xcolor
; options            = dvipsnames, svgnames, x11names
; Named colours (define with \definecolor or \colorlet):
; primary            = 2A4080           ; hex
; secondary          = 803A2A


;------------------------------ TYPOGRAPHY ---------------------------------
[package:csquotes]
; name               = csquotes         ; context-sensitive quotation marks
;                                       ; required by biblatex
; style              = american         ; american | british | french | ...
; autostyle          = true

[package:setspace]
; name               = setspace
; spread             = 1.0              ; \linespread value (1.3 = one-half, 1.6 = double)


;------------------------------ PAGE LAYOUT ------------------------------------
; Fine-grained spacing beyond geometry.
[layout]
; parindent          = 1.5em
; parskip            = 0pt plus 0.5ex
; topskip            = 10pt
; headheight         = 14pt             ; must satisfy fancyhdr / scrlayer
; headsep            = 10pt
; footskip           = 30pt
; columnsep          = 12pt
; marginparwidth     = 2cm
; marginparsep       = 5pt
; linespread         = 1.0

[package:fancyhdr]
; name               = fancyhdr
; style              = fancy            ; fancy | plain | empty
; lhead              =
; chead              = \leftmark
; rhead              = \thepage
; lfoot              =
; cfoot              =
; rfoot              =
; headrulewidth      = 0.4pt
; footrulewidth      = 0pt


;------------------------------ SECTION/CHAPTER FORMATTING --------------------
[package:titlesec]
; name               = titlesec
; options            = compact, explicit, clearempty


;------------------------------ ENUMITEM GLOBAL OPTIONS -----------------------
; \setlist options (applied globally or per list type).
[package:enumitem.defaults]
; leftmargin         = *
; labelsep           = 0.5em
; parsep             = 0pt
; itemsep            = 2pt
; topsep             = 4pt
; noitemsep          = false


;------------------------------ CAPTION EXTRA OPTIONS -------------------------
; Additional \captionsetup keys.
[package:caption.extra]
; font               = small
; labelfont          = bf
; format             = hang
; margin             = 10pt
; width              = 0.85\textwidth
; skip               = 6pt
; position           = bottom


;------------------------------ TABLES -----------------------------------------
[package:tables]
; booktabs           =                   ; \toprule, \midrule, \bottomrule
; longtable          =                   ; multi-page tables
; multirow           =                   ; row-spanning cells
; tabularray         =                   ; modern replacement for tabular/array
; siunitx            =                   ; aligned SI-unit columns (S column type)


;------------------------------ FIGURES ----------------------------------------
[package:figures]
; graphicx           =                   ; \includegraphics (currently commented out)
; graphicx.options   = draft             ; or final
; float              =                   ; [H] placement
; wrapfig            =                   ; text-wrapping figures
; subcaption         =                   ; subfigures / subtables


;------------------------------ MATH EXTRA -------------------------------------
[package:math.extra]
; siunitx            =                   ; SI quantities: \qty{3.0e8}{\meter\per\second}
; nicematrix         =                   ; block matrices with nice delimiters
; empheq             =                   ; boxed / highlighted equation groups
; diffcoeff          =                   ; semantic \dl, \dl[2] derivatives
; derivative         =                   ; alternative: \odv, \pdv
; tensor             =                   ; currently commented out in source
; thmtools           =                   ; extended theorem environments + \listoftheorems
; mdframed           =                   ; framed theorems / remarks

; Additional unicode-math font ranges:
[fonts.math.extra]
; range-mathtt       = NewCMMono10-Book.otf   ; (currently commented out in source)
; range-mathbb       =                         ; separate font for \mathbb
; range-mathcal      =                         ; separate font for \mathcal


;------------------------------ BIBLIOGRAPHY ALTERNATIVE ----------------------
; biblatex + biber is the modern alternative to BibTeX.
[package:biblatex]
; name               = biblatex
; backend            = biber            ; biber | bibtex
; style              = alphabetic       ; numeric | alphabetic | authoryear | phys | ...
; sorting            = nyt              ; nyt (name-year-title) | nty | nyvt | none
; maxnames           = 3
; minnames           = 1
; giveninits         = true
; isbn               = false
; doi                = true
; eprint             = false
; date               = year


;------------------------------ CODE LISTINGS ----------------------------------
[package:listings]
; name               = listings
; basicstyle         = \ttfamily\small
; keywordstyle       = \bfseries
; commentstyle       = \itshape
; numberstyle        = \tiny
; numbers            = left
; stepnumber         = 1
; breaklines         = true

; minted needs --shell-escape
[package:minted]
; name               = minted
; style              = friendly
; linenos            = true
; fontsize           = \small


;------------------------------ GLOSSARIES / INDEX ----------------------------
[package:glossaries]
; name               = glossaries-extra
; options            = record, stylemods
; toc                = true

[package:index]
; name               = imakeidx
; toc                = true


;------------------------------ PDF OUTPUT ------------------------------------
[pdf]
; version            = 1.7              ; PDF version (LuaLaTeX default is 1.5)
; compress           = 9               ; zlib compression level 0–9
; objcompresslevel   = 2
; inclusion-error-level = 0
; pdfpages           =                  ; \usepackage{pdfpages} — include external PDFs


;------------------------------ CROSS-REFERENCES ------------------------------
[package:references]
; cleveref           =                   ; \cref, \Cref — automatic type prefix
; cleveref.options   = nameinlink, noabbrev
; varioref           =                   ; page-aware references ("on the facing page")


;------------------------------ LINE NUMBERS -----------------------------------
[package:lineno]
; name               = lineno
; options            = left, mathlines
; modulo             = 5                ; print every 5th line number


;------------------------------ TIKZ / PGFPLOTS -------------------------------
; (commented out in source; included here for completeness)
[package:tikz]
; name               = tikz
; libraries          = arrows, calc, matrix, patterns, shadows, shapes, plotmarks
; pgfplots           =                  ; \usepackage{pgfplots}


; ==============================================================================
; END OF FILE
