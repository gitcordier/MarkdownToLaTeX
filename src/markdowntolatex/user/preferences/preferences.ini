;SOURCES FOR MICROTYPE PLACEMENT AND CONFIGURATION ADVICE

;For the placement rule (after fonts, after polyglossia):

;* The `microtype` package documentation (`microtype.pdf`) by Robert Schlicht, which explicitly states the load-order constraints relative to font packages.
;* The `fontspec` manual by Will Robertson, which discusses interaction with other packages.

;For the LuaLaTeX-specific behaviour (expansion, HFactor warnings):

;* The LuaTeX reference manual and known interaction reports between `unicode-math` and `microtype` that circulate on TeX Stack Exchange. The HFactor warning in particular is a well-documented rough edge when using OpenType math fonts with microtype's expansion.

;For the general advice (protrusion vs expansion priority):

;* Robert Bringhurst's The Elements of Typographic Style informs the underlying principle, and Schlicht's own examples in the `microtype` manual demonstrate that protrusion has a more perceptible effect on page texture than expansion.

;One honest caveat: 

;LuaLaTeX and its package ecosystem move relatively fast. My training has a cutoff of August 2025, and I can't guarantee that the HFactor interaction or the `\AtBeginDocument` behaviour haven't been patched since. If you hit unexpected warnings, checking the current `microtype` CTAN page or TeX Stack Exchange for your exact package combination is the safest move.