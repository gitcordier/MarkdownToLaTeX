[build-system]
requires      = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name            = "markdowntolatex"
version         = "1.0.0"
description     = "Translate Markdown to LaTeX and PDF via LuaLaTeX."
readme          = "README.md"
license         = { text = "MIT" }
authors         = [{ name = "Jean-Gabriel Cordier" }]
requires-python = ">=3.14"
dependencies    = []
classifiers     = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Markup :: LaTeX",
    "Topic :: Text Processing :: Markup :: Markdown",
]

[project.urls]
Homepage      = "https://github.com/yourorg/markdowntolatex"
Documentation = "https://markdowntolatex.readthedocs.io"
Changelog     = "https://github.com/yourorg/markdowntolatex/blob/main/CHANGELOG.txt"

[project.optional-dependencies]
docs = [
    "sphinx>=7.0",
    "furo>=2024.0",
    "sphinx-copybutton>=0.5",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
markdowntolatex = "markdowntolatex.user.cli:main"

[tool.setuptools.packages.find]
where = ["src"]